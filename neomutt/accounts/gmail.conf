# vim: filetype=muttrc
set my_account_file = "~/.config/neomutt/accounts/gmail.conf"

set realname     = "Johannes Korbmacher"
set from         = "jkorbmacher@gmail.com"

set signature   = "~/.config/neomutt/accounts/gmail_signature"

set spoolfile    = '+gmail/Inbox'
set record       = '+gmail/Sent Mail'
set trash        = '+gmail/Trash'
set postponed    = '+gmail/Drafts'

set sendmail     = "msmtp -a gmail"

macro index si  "<tag-prefix><save-message>+gmail/Inbox\n<sync-mailbox>" "Save to Inbox"
macro index sa  "<tag-prefix><save-message>+gmail/All<quote-char><space>Mail\n<sync-mailbox>" "Save to Archive"
macro index sj  "<tag-prefix><save-message>+gmail/Spam\n<sync-mailbox>" "Save to Spam"

# tag-prefix belongs to the index; the pager files only the current message.
macro pager si  "<save-message>+gmail/Inbox\n<sync-mailbox>" "Save to Inbox"
macro pager sa  "<save-message>+gmail/All<quote-char><space>Mail\n<sync-mailbox>" "Save to Archive"
macro pager sj  "<save-message>+gmail/Spam\n<sync-mailbox>" "Save to Spam"

macro index,pager ga "<change-folder>=gmail/All<quote-char><space>Mail<enter>"                      "Go to Archive"
macro index,pager gA "<change-folder>=gmail/All<quote-char><space>Mail<enter>" "Go to Archive"
