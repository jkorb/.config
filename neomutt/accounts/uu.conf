# vim: filetype=muttrc
set my_account_file = "~/.config/neomutt/accounts/uu.conf"

set realname    = "Korbmacher, J. (Johannes)"
set from        = "j.korbmacher@uu.nl"

set signature   = "~/.config/neomutt/accounts/uu_signature.txt"

set spoolfile   = "$my_uu_folder/INBOX"
# Graph saves sent mail; mbsync keeps a download-only copy.
set record      = ""
set trash       = "$my_uu_folder/Trash"
set postponed   = "+uu/LocalDrafts"
# Drafts stay local; existing mail is filed with server-side IMAP COPY.

set sendmail    = "msmtp -a uu"

macro index si  "<tag-prefix><save-message>$my_uu_folder/INBOX\n<sync-mailbox>" "Save to Inbox"
macro index sa  "<tag-prefix><save-message>$my_uu_folder/Archive\n<sync-mailbox>" "Save to Archive"
macro index sj  "<tag-prefix><save-message>$my_uu_folder/Junk\n<sync-mailbox>" "Save to Junk"

# tag-prefix belongs to the index; the pager files only the current message.
macro pager si  "<save-message>$my_uu_folder/INBOX\n<sync-mailbox>" "Save to Inbox"
macro pager sa  "<save-message>$my_uu_folder/Archive\n<sync-mailbox>" "Save to Archive"
macro pager sj  "<save-message>$my_uu_folder/Junk\n<sync-mailbox>" "Save to Junk"

macro index,pager ga "<change-folder-readonly>+uu/Archive<enter>" "Browse downloaded Archive"
macro index,pager gA "<change-folder>$my_uu_folder/Archive<enter>" "Open live Archive"
