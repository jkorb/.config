# Generated by theme-build. Edit themes/palette.json or themes/templates instead.
set -g status-style "bg=default,fg=@@foreground@@"
set -g window-status-style "bg=default,fg=@@comment@@"
set -g window-status-current-style "bg=default,fg=@@accent@@,bold"
set -g pane-border-style "fg=@@border@@"
set -g pane-active-border-style "fg=@@accent@@"
set -g message-style "bg=default,fg=@@accent@@"
set -g message-command-style "bg=default,fg=@@accent@@"
setw -g mode-style "bg=@@selection_bg@@,fg=@@selection_fg@@"
set -g @thumbs-hint-fg-color "@@green@@"
set -g @thumbs-fg-color "@@background@@"
set -g @thumbs-bg-color "@@yellow@@"
set -g @easy-motion-dim-style "fg=@@comment@@"
set -g @easy-motion-highlight-style "fg=@@yellow@@,bold"
set -g @easy-motion-highlight-2-first-style "fg=@@green@@,bold"
set -g @easy-motion-highlight-1-second-style "fg=@@yellow@@,bold"
