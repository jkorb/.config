# Generated by theme-build. Edit themes/palette.json or themes/templates instead.
set -g status-style "bg=default,fg=#abb2bf"
set -g window-status-style "bg=default,fg=#7f848e"
set -g window-status-current-style "bg=default,fg=#d7dae0"
# Powerline caps fill the cell height; WezTerm draws these without font margins.
set -g window-status-current-format '#[fg=#30363f,bg=default,nobold]#[fg=#d7dae0,bg=#30363f,bold] #I #W #[fg=#30363f,bg=default,nobold]#[default]'
set -g pane-border-style "fg=#3f4451"
set -g pane-active-border-style "fg=#4aa5f0"
set -g message-style "bg=#282c34,fg=#abb2bf"
set -g message-command-style "bg=default,fg=#4aa5f0"
setw -g mode-style "bg=#30363f,fg=#d7dae0"
set -g popup-style "bg=default,fg=#abb2bf"
set -g popup-border-style "bg=default,fg=#3f4451"
set -g menu-style "bg=default,fg=#abb2bf"
set -g menu-border-style "bg=default,fg=#3f4451"
set -g menu-selected-style "bg=#30363f,fg=#d7dae0,bold"
set -g status-left '#[fg=#42b3c2]    #[fg=#abb2bf]#S #[fg=#3f4451]│ '
set -g @thumbs-hint-fg-color "#8cc265"
set -g @thumbs-fg-color "#1e1e1e"
set -g @thumbs-bg-color "#d18f52"
set -g @easy-motion-dim-style "fg=#7f848e"
set -g @easy-motion-highlight-style "fg=#d18f52,bold"
set -g @easy-motion-highlight-2-first-style "fg=#8cc265,bold"
set -g @easy-motion-highlight-1-second-style "fg=#d18f52,bold"
